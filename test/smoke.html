<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>THORNMERE smoke test</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div id="game">
    <div id="toprow">
      <div id="viewwrap">
        <canvas id="view" width="320" height="240"></canvas>
        <div class="nav" id="nav-up" data-key="ArrowUp">▲</div>
        <div class="nav" id="nav-left" data-key="ArrowLeft">◀</div>
        <div class="nav" id="nav-right" data-key="ArrowRight">▶</div>
        <div class="nav" id="nav-down" data-key="ArrowDown">▼</div>
        <div id="loc"></div>
      </div>
      <div id="right">
        <div id="status" class="panel" data-title="THORNMERE"></div>
        <div id="menu" class="panel" data-title="·"></div>
        <div id="log" class="panel" data-title="EVENTS"></div>
      </div>
    </div>
    <div id="roster" class="panel" data-title="THE COMPANY"></div>
    <div id="cmdbar"></div>
    <div id="hint"></div>
  </div>
  <script type="module" src="../src/main.js"></script>
  <script type="module" src="smoke.js"></script>
</body>
</html>
